# Runs the test suite on every push and pull request, on the oldest Python
# that pyproject.toml accepts and on a recent one.
name: tests

on: [push, pull_request]

# The tests only need to read the repository.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # So that a failure on one version does not cancel the run on the other.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
